name: Desktop
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

jobs:
  # Runs the Rust tests (real LaTeX compilation, shell-escape hardening, timeouts, folder mirror, OS keychain)
  # on all three operating systems, with a TeX distribution installed so the TeX detection path is exercised.
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            texlive-latex-base texlive-latex-recommended latexmk
      - name: macOS TeX (BasicTeX)
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: Windows TeX (MiKTeX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install miktex --no-progress -y
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $env:PATH = "$bin;$env:PATH"
          # A fresh MiKTeX refuses to run until its package database exists, and it must be allowed to fetch
          # missing packages (article.cls, fonts...) without a prompt.
          initexmf --admin --set-config-value="[MPM]AutoInstall=1"
          miktex --admin packages update-package-database
          miktex --admin packages update
          initexmf --admin --update-fndb
          initexmf --update-fndb
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare frontend dist (required by tauri::generate_context)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @p2platex/web build
      - name: Detect TeX
        shell: bash
        run: |
          export PATH="$PATH:/Library/TeX/texbin"
          which pdflatex || true
          pdflatex --version | head -1 || true
          # Compile a tiny document the same way the app does, so a broken TeX setup shows its real error here.
          mkdir -p "$RUNNER_TEMP/texcheck" && cd "$RUNNER_TEMP/texcheck"
          printf '\\documentclass{article}\n\\begin{document}\nHi\n\\end{document}\n' > main.tex
          pdflatex -interaction=nonstopmode -synctex=1 -no-shell-escape main.tex || echo "pdflatex FAILED ($?)"
          latexmk -pdf -interaction=nonstopmode main.tex || echo "latexmk FAILED ($?)"
          ls -la
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  # Linux: a desktop instance and a browser instance sync a project (checks WebRTC works inside the webview/engine we ship).
  e2e-sync:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/auth-and-collab.spec.ts e2e/offline-and-compile.spec.ts
        env: { CI: "true" }

  # The real desktop app driven over WebDriver (tauri-driver): folders picked through the `test-picker` debug build,
  # create-from-folder, link/open marker folders, import, external edits. See apps/desktop/e2e.
  desktop-e2e:
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # WebView2/msedgedriver pairing on hosted Windows runners can lag behind; Linux is the gating platform (TODO_CI.md).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Linux system libraries and WebKit WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            webkit2gtk-driver xvfb
      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $ver"
          $dir = "$env:RUNNER_TEMP\edgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          "MSEDGEDRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Desktop UI tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @p2platex/desktop e2e
      - name: Desktop UI tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @p2platex/desktop e2e

  # Tagged releases: signed installers + auto-update manifest (latest.json) on GitHub Releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: rust-tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing key: `pnpm --filter @p2platex/desktop tauri signer generate`; the public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional OS code signing (without these, installers are unsigned and show SmartScreen/Gatekeeper warnings).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_API_BASE: ${{ vars.P2PLATEX_API_BASE }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "p2platex ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
