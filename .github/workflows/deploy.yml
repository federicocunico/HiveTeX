name: Deploy
# Reuse one serialized production job for master CI, published releases and manual recovery.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag to retry; leave empty to deploy this checked commit"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/deploy-production.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha || '' }}
      release_tag: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
      trigger_kind: ${{ github.event_name == 'workflow_run' && 'master' || github.event_name == 'release' && 'release' || 'manual' }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
