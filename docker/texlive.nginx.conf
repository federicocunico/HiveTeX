# Serves a TeX Live tree in the SwiftLaTeX layout (pdftex/<n>/<file>, xetex/<n>/<file>) for the in-browser engine.
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Expose-Headers "fileid, pkid" always;
  location / {
    try_files $uri =404;
  }
}
