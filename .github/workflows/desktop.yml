name: Desktop
# The desktop app. Tests run on Linux and Windows in parallel; installers are built for Windows only (for now):
# - Tag v* -> draft GitHub Release with the Windows installers and the signed auto-update manifest (latest.json),
#   published by the Release workflow.
# - Manual run (Actions -> Desktop -> Run workflow) -> the same installers as workflow artifacts, no release.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "server/**"
      - "e2e/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Rust tests (real LaTeX compilation, shell-escape hardening, timeouts, folder mirror, OS keychain, native store,
  # transport, UPnP client and mapping manager) with a TeX distribution installed, plus the patched webrtc-ice suite.
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            apps/desktop/src-tauri/vendor/webrtc-ice
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - name: Linux system libraries and TeX
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            texlive-latex-base texlive-latex-recommended latexmk
      - name: Windows TeX (MiKTeX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Chocolatey feed is sometimes briefly unavailable (503): retry before failing the job.
          for ($i = 1; $i -le 4; $i++) {
            choco install miktex --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 4) { exit 1 }
            Start-Sleep -Seconds (30 * $i)
          }
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $env:PATH = "$bin;$env:PATH"
          # A fresh MiKTeX refuses to run until its package database exists, and it must be allowed to fetch
          # missing packages (article.cls, fonts...) without a prompt.
          initexmf --admin --set-config-value="[MPM]AutoInstall=1"
          miktex --admin packages update-package-database
          miktex --admin packages update
          initexmf --admin --update-fndb
          initexmf --update-fndb
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Frontend dist and bundled sync worker (required by tauri::generate_context)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hivetex/web build
          node apps/desktop/prepare-worker.mjs
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib
      - name: Patched webrtc-ice (mapped endpoints on the UDP mux; vendor/PATCHES.md)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri/vendor/webrtc-ice
        run: cargo test --lib

  # Router matrix (13.4): Linux namespaces with a UPnP router (miniupnpd), a symmetric NAT, TURN and packet capture;
  # the peers are the app's native stack (rtc_cli). Mapped direct, no-hairpin LAN, unsupported UPnP and relay only.
  router-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      # setup-node reads packageManager (pnpm) from package.json and needs pnpm on PATH.
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: System libraries and network lab tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config \
            iproute2 iptables nftables miniupnpd-nftables coturn tcpdump iputils-ping
          # The packaged services must not run on the runner itself.
          sudo systemctl stop miniupnpd coturn 2>/dev/null || true
      - name: Router matrix
        run: |
          mkdir -p apps/web/dist && echo '<!doctype html>' > apps/web/dist/index.html
          cd apps/desktop/src-tauri
          TAURI_CONFIG='{"bundle":{"resources":[]}}' cargo build --example rtc_cli
          sudo NETLAB_OUT="$RUNNER_TEMP/netlab-result.json" "$(which node)" ../e2e/netlab/matrix.mjs "$PWD/target/debug/examples/rtc_cli"
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: router-matrix, path: "${{ runner.temp }}/netlab-result.json", if-no-files-found: ignore }

  # The real desktop app driven over WebDriver (tauri-driver), with the local server and a Chromium co-author for the
  # relay, fault-injection and doorbell tests. On Windows also the lifecycle checks without WebDriver (lifecycle.mjs).
  desktop-e2e:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: on windows-2025 WebView2 (>= 133) never opens the DevTools port msedgedriver needs
        # (https://github.com/actions/runner-images/issues/14738).
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Linux system libraries and WebKit WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $ver"
          $dir = "$env:RUNNER_TEMP\edgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          "MSEDGEDRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Browser for the desktop/browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop UI tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # The app keeps device keys in the OS keychain (Secret Service): give it an unlocked keyring on a session bus.
        # A 1440x900 screen gives the wide workspace (xvfb defaults to 640x480); the Windows runner (1024x768) covers the narrow one.
        run: |
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a -s "-screen 0 1440x900x24" pnpm --filter @hivetex/desktop e2e'
      - name: Desktop UI tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @hivetex/desktop e2e

  # Windows installers (exe, msi) and the signed update manifest. Installers do not wait for the tests: `make release`
  # only tags a commit whose CI and Desktop runs already passed, so a flaky test cannot block a release.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    # Pinned image: a change of the -latest default must not silently break a release.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in the sources
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $v in tauri.conf.json (run: make version VERSION=x.y.z)"; exit 1
          fi
      - name: Updater signing key present (releases)
        if: env.IS_TAG == 'true' && env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret (gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/hivetex.key)"; exit 1
      - name: Build options
        shell: bash
        run: |
          extra=""
          # Without the key a manual run still builds, just without update signatures.
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            extra="--config $RUNNER_TEMP/no-updater.json"
          fi
          echo "TAURI_ARGS=$extra" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3 4; do
            pnpm install --frozen-lockfile && break
            [ "$i" = 4 ] && exit 1
            sleep $((20 * i))
          done
      - name: Fetch Rust crates
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          for i in 1 2 3 4; do
            cargo fetch --locked && break
            [ "$i" = 4 ] && exit 1
            sleep $((20 * i))
          done
      - name: Build and release (tag)
        if: env.IS_TAG == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Default server baked into the installers (testers can change it on the sign-in screen).
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "hivetex ${{ github.ref_name }}"
          releaseBody: "Windows installers. See the README for first-launch notes."
          releaseDraft: true
          args: ${{ env.TAURI_ARGS }}
      - name: Build only (manual run)
        if: env.IS_TAG != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
      # The built app starts its own bundled worker with no Node on PATH (a clean machine), then exits.
      - name: Packaged startup check
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          # A GUI-subsystem exe: `&` does not wait for it nor set $LASTEXITCODE, Start-Process -Wait does.
          $p = Start-Process -FilePath apps/desktop/src-tauri/target/release/hivetex-desktop.exe -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { Write-Error "self-check exited with $($p.ExitCode)"; exit 1 }
      - name: Check that a new Windows installer replaces the old version (manual run)
        if: env.IS_TAG != 'true'
        shell: pwsh
        run: ./scripts/verify-upgrade.ps1 -Bundle apps/desktop/src-tauri/target/release/bundle -Repo "${{ github.repository }}"
      - name: Upload installers (manual run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: hivetex-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/release/bundle/*/*.msi
            apps/desktop/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error
