[package]
name = "p2platex-desktop"
version = "0.0.0"
edition = "2021"
default-run = "p2platex-desktop"
license = "AGPL-3.0-or-later"

[lib]
name = "p2platex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8"
sysinfo = "0.33"
webrtc = "0.13"
bytes = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
starship-battery = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# Automated desktop UI tests only: `mirror_pick` returns the folder named by P2PLATEX_TEST_PICK_DIR instead of opening
# the native dialog (WebDriver cannot drive OS dialogs). Never enabled in release builds.
test-picker = []
