name: Desktop
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"

jobs:
  # Runs the Rust tests (real LaTeX compilation, shell-escape hardening, timeouts, folder mirror, OS keychain)
  # on all three operating systems, with a TeX distribution installed so the TeX detection path is exercised.
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            texlive-latex-base texlive-latex-recommended latexmk
      - name: macOS TeX (BasicTeX)
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: Windows TeX (MiKTeX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Chocolatey feed is sometimes briefly unavailable (503): retry before failing the job.
          for ($i = 1; $i -le 4; $i++) {
            choco install miktex --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 4) { exit 1 }
            Start-Sleep -Seconds (30 * $i)
          }
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $env:PATH = "$bin;$env:PATH"
          # A fresh MiKTeX refuses to run until its package database exists, and it must be allowed to fetch
          # missing packages (article.cls, fonts...) without a prompt.
          initexmf --admin --set-config-value="[MPM]AutoInstall=1"
          miktex --admin packages update-package-database
          miktex --admin packages update
          initexmf --admin --update-fndb
          initexmf --update-fndb
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare frontend dist (required by tauri::generate_context)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @hivetex/web build
      - name: Detect TeX
        shell: bash
        run: |
          export PATH="$PATH:/Library/TeX/texbin"
          which pdflatex || true
          pdflatex --version | head -1 || true
          # Compile a tiny document the same way the app does, so a broken TeX setup shows its real error here.
          mkdir -p "$RUNNER_TEMP/texcheck" && cd "$RUNNER_TEMP/texcheck"
          printf '\\documentclass{article}\n\\begin{document}\nHi\n\\end{document}\n' > main.tex
          pdflatex -interaction=nonstopmode -synctex=1 -no-shell-escape main.tex || echo "pdflatex FAILED ($?)"
          latexmk -pdf -interaction=nonstopmode main.tex || echo "latexmk FAILED ($?)"
          ls -la
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  # Linux: a desktop instance and a browser instance sync a project (checks WebRTC works inside the webview/engine we ship).
  e2e-sync:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test e2e/auth-and-collab.spec.ts e2e/offline-and-compile.spec.ts
        env: { CI: "true" }

  # The real desktop app driven over WebDriver (tauri-driver): folders picked through the `test-picker` debug build,
  # create-from-folder, link/open marker folders, import, external edits. See apps/desktop/e2e.
  desktop-e2e:
    needs: rust-tests
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: on windows-2025 WebView2 (>= 133) never opens the DevTools port msedgedriver needs
        # (https://github.com/actions/runner-images/issues/14738). Kept non-blocking until it has proven stable.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'windows') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Linux system libraries and WebKit WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config \
            webkit2gtk-driver xvfb dbus-x11 gnome-keyring
      - name: msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = (Get-ItemProperty $key).pv
          Write-Host "WebView2 $ver"
          $dir = "$env:RUNNER_TEMP\edgedriver"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dir -Force
          "MSEDGEDRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Desktop UI tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # The app keeps device keys in the OS keychain (Secret Service): give it an unlocked keyring on a session bus.
        # A 1440x900 screen gives the wide workspace (xvfb defaults to 640x480); the Windows runner (1024x768) covers the narrow one.
        run: |
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a -s "-screen 0 1440x900x24" pnpm --filter @hivetex/desktop e2e'
      - name: Desktop UI tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter @hivetex/desktop e2e

  # Desktop installers for Windows (exe/msi), macOS (universal dmg) and Linux (AppImage/deb).
  # - Tag v* -> draft GitHub Release with installers and the signed auto-update manifest (latest.json).
  # - Manual run (Actions -> Desktop -> Run workflow) -> the same installers as workflow artifacts, no release.
  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: rust-tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned images: a change of the *-latest defaults must not silently break a release.
          - os: windows-2025
            args: ""
          - os: macos-15
            args: "--target universal-apple-darwin"
          - os: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in the sources
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $v in tauri.conf.json (run: make version VERSION=x.y.z)"; exit 1
          fi
      - name: Updater signing key present (releases)
        if: env.IS_TAG == 'true' && env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret (gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/hivetex.key)"; exit 1
      - name: Build options
        shell: bash
        run: |
          extra=""
          # Without the key a manual run still builds, just without update signatures.
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            extra="--config $RUNNER_TEMP/no-updater.json"
          fi
          echo "TAURI_ARGS=${{ matrix.args }} $extra" >> "$GITHUB_ENV"
          # Optional paid code signing: export only what is configured (an empty identity would override ad-hoc signing).
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!k}" ] && echo "$k=${!k}" >> "$GITHUB_ENV" || true
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev pkg-config libfuse2
          # linuxdeploy's bundled strip cannot read Ubuntu 24.04's .relr.dyn sections, and linuxdeploy (itself an
          # AppImage) is run extracted instead of through FUSE.
          echo "NO_STRIP=true" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build and release (tag)
        if: env.IS_TAG == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Default server baked into the installers (testers can change it on the sign-in screen).
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "hivetex ${{ github.ref_name }}"
          releaseBody: "Installers for Windows, macOS and Linux. See the README section \"Release v0.1 and test with others\" for first-launch notes."
          releaseDraft: true
          args: ${{ env.TAURI_ARGS }}
      - name: Build only (manual run)
        if: env.IS_TAG != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
      - name: Upload installers (manual run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: hivetex-${{ matrix.os }}
          # installers only (not the unpacked AppDir / .app folders)
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/release/bundle/*/*.msi
            apps/desktop/src-tauri/target/release/bundle/*/*.dmg
            apps/desktop/src-tauri/target/release/bundle/*/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/*/*.deb
            apps/desktop/src-tauri/target/release/bundle/*/*.sig
            apps/desktop/src-tauri/target/release/bundle/*/*.app.tar.gz
            apps/desktop/src-tauri/target/*/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/*/release/bundle/*/*.msi
            apps/desktop/src-tauri/target/*/release/bundle/*/*.dmg
            apps/desktop/src-tauri/target/*/release/bundle/*/*.AppImage
            apps/desktop/src-tauri/target/*/release/bundle/*/*.deb
            apps/desktop/src-tauri/target/*/release/bundle/*/*.sig
            apps/desktop/src-tauri/target/*/release/bundle/*/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
