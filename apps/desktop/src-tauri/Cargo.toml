[package]
name = "p2platex-desktop"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "p2platex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
