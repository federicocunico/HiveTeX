name: CI
# Data safety and local build smoke checks are required. Broader browser diagnostics remain advisory.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - name: Scan committed history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download v8.30.0 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.0_windows_x64.zip' --pattern '*checksums.txt' --dir $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $dir 'gitleaks_8.30.0_windows_x64.zip'
          $line = Get-Content (Join-Path $dir 'gitleaks_8.30.0_checksums.txt') | Where-Object { $_ -match 'gitleaks_8.30.0_windows_x64.zip$' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $dir
          & "$dir/gitleaks.exe" git . --no-banner --redact --config .gitleaks.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - name: Deployment and CI policy regressions
        run: node --test scripts/deploy-production.test.mjs scripts/advisory-report.test.mjs
      - name: Build, lint and unit tests
        run: pnpm turbo run build lint test --concurrency=1 --output-logs=errors-only
      - name: Frontend types and bundle budget
        run: |
          pnpm --filter @hivetex/web exec svelte-check --tsconfig ./tsconfig.json --threshold error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hivetex/web size
      - name: Dependency audit
        run: pnpm audit --audit-level=high

  data-safety-browser:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - run: pnpm exec playwright install chromium
      - name: Required history, permissions, offline merge, assets and local build routing
        run: pnpm exec playwright test e2e/changes.spec.ts e2e/recovery.spec.ts e2e/folder-import.spec.ts e2e/compile-modes.spec.ts e2e/full-flow.spec.ts e2e/offline-and-compile.spec.ts e2e/compiler-state.spec.ts e2e/workspace.spec.ts --retries=0
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: data-safety-browser-failure
          path: test-results/
          retention-days: 7

  authoring-browser:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - run: pnpm exec playwright install chromium
      - name: Required editor, scheduling, preview and reachable controls
        run: |
          pnpm exec playwright test e2e/editor-geometry.spec.ts e2e/compile-scheduling.spec.ts e2e/pdf-preview.spec.ts e2e/synctex.spec.ts e2e/format-overflow.spec.ts e2e/workspace-status.spec.ts e2e/authoring.spec.ts --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: authoring-browser-failure
          path: test-results/
          retention-days: 7

  authoring-real-and-visual:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - run: pnpm exec playwright install chromium
      - name: Required real article/report and reviewed visual baselines
        run: |
          pnpm exec playwright test e2e/compiler-templates.spec.ts e2e/authoring-visual.spec.ts --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @hivetex/web build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright test --config playwright.production.config.ts --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: authoring-real-and-visual
          path: test-results/
          retention-days: 14

  authoring-stress:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - run: pnpm exec playwright install chromium
      - name: Required long manuscript, real PDF and collaboration stress
        run: |
          pnpm exec playwright test e2e/authoring-stress.spec.ts --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: authoring-stress
          path: test-results/
          retention-days: 14

  browser-diagnostics:
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prepare compiler resources before browser or build startup
        uses: ./.github/actions/prepare-tex-distribution
        timeout-minutes: 10
      - run: pnpm exec playwright install chromium
      - name: Browser diagnostics (advisory)
        id: tests
        continue-on-error: true
        run: pnpm exec playwright test --reporter=list,json
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/playwright.json
      - name: Report diagnostic failures and retries
        if: always()
        run: node scripts/advisory-report.mjs browser "${{ steps.tests.outcome }}" test-results/playwright.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
