name: Desktop
# Required native/instance checks and installers: Windows only. UI diagnostics are available on demand.
# - Tag v* -> draft GitHub Release with the Windows installers and the signed auto-update manifest (latest.json),
#   published by the Release workflow.
# - Manual run (Actions -> Desktop -> Run workflow) -> the same installers as workflow artifacts, no release.
on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Run the optional WebDriver UI diagnostics (warnings only)"
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "server/**"
      - "e2e/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust-tests:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Windows TeX (TinyTeX)
        shell: pwsh
        run: |
          # TinyTeX from GitHub releases, the same archive and checksum the app installs (src/managed.rs): MiKTeX's
          # Chocolatey package and on-the-fly installs depend on miktex.org mirrors that time out on runners.
          $url = 'https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-1-windows-v2026.10.exe'
          $sfx = Join-Path $env:RUNNER_TEMP 'tinytex.exe'
          for ($i = 1; $i -le 4; $i++) {
            try { Invoke-WebRequest $url -OutFile $sfx; break } catch { if ($i -eq 4) { throw }; Start-Sleep -Seconds (15 * $i) }
          }
          $hash = (Get-FileHash $sfx -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '36c329c644683d981a668419d13c8804696e2816ae4d287ad755788fee231a31') { throw "TinyTeX checksum mismatch: $hash" }
          7z x $sfx "-o$env:RUNNER_TEMP" -y | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP 'TinyTeX\bin\windows'
          if (-not (Test-Path "$bin\pdflatex.exe")) { Get-ChildItem (Join-Path $env:RUNNER_TEMP 'TinyTeX\bin'); throw 'pdflatex not found' }
          $env:PATH = "$bin;$env:PATH"
          # Warm-up build: a broken TeX fails here, with its log, not in the middle of a test.
          $warm = Join-Path $env:RUNNER_TEMP 'tex-warmup'
          New-Item -ItemType Directory -Force $warm | Out-Null
          Set-Content -Path "$warm\main.tex" -Value '\documentclass{article}\begin{document}Hello \LaTeX{}\end{document}'
          Push-Location $warm
          latexmk -pdf -interaction=nonstopmode main.tex
          if (-not (Test-Path main.pdf)) { Get-Content main.log -ErrorAction SilentlyContinue; exit 1 }
          Pop-Location
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: node apps/desktop/prepare-worker.mjs
      - run: pnpm --filter @hivetex/web build
      - name: Native regressions (serialized process/credential tests)
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --lib -- --test-threads=1
      - name: Concurrent launch, background reopening and update restart
        run: pnpm --filter @hivetex/desktop e2e
        env:
          HIVETEX_LIFECYCLE_ONLY: '1'

  # WebDriver availability and GUI timing vary on hosted runners; run these manually with visible warnings.
  desktop-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-driver --locked
      - run: pnpm exec playwright install chromium
      - name: Desktop UI diagnostics (advisory)
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          pnpm --filter @hivetex/desktop e2e 2>&1 | Tee-Object -FilePath test-results/desktop-diagnostics.log
      - name: Report diagnostic result
        if: always()
        run: node scripts/advisory-report.mjs desktop "${{ steps.tests.outcome }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-diagnostics
          path: test-results/
          if-no-files-found: ignore

  build:
    needs: rust-tests
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    # Pinned image: a change of the -latest default must not silently break a release.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the version in the sources
        if: env.IS_TAG == 'true'
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version $v in tauri.conf.json (run: make version VERSION=x.y.z)"; exit 1
          fi
      - name: Updater signing key present (releases)
        if: env.IS_TAG == 'true' && env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret (gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/hivetex.key)"; exit 1
      - name: Checked source before tagging
        if: env.IS_TAG == 'true'
        run: node scripts/release-check.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build options
        shell: bash
        run: |
          extra=""
          # Without the key a manual run still builds, just without update signatures.
          if [ "$HAS_UPDATER_KEY" != "true" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"
            extra="--config $RUNNER_TEMP/no-updater.json"
          fi
          echo "TAURI_ARGS=$extra" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Install dependencies
        shell: bash
        run: |
          for i in 1 2 3 4; do
            pnpm install --frozen-lockfile && break
            [ "$i" = 4 ] && exit 1
            sleep $((20 * i))
          done
      - name: Fetch Rust crates
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          for i in 1 2 3 4; do
            cargo fetch --locked && break
            [ "$i" = 4 ] && exit 1
            sleep $((20 * i))
          done
      - name: Build and release (tag)
        if: env.IS_TAG == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Default server baked into the installers (testers can change it on the sign-in screen).
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "hivetex ${{ github.ref_name }}"
          releaseBody: "Windows installers. See the README for first-launch notes."
          releaseDraft: true
          args: ${{ env.TAURI_ARGS }}
      - name: Build only (manual run)
        if: env.IS_TAG != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_BASE: ${{ vars.HIVETEX_API_BASE }}
        with:
          projectPath: apps/desktop
          args: ${{ env.TAURI_ARGS }}
      # The built app starts its own bundled worker with no Node on PATH (a clean machine), then exits.
      - name: Packaged startup check
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          # A GUI-subsystem exe: `&` does not wait for it nor set $LASTEXITCODE, Start-Process -Wait does.
          $p = Start-Process -FilePath apps/desktop/src-tauri/target/release/hivetex-desktop.exe -ArgumentList '--self-check' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { Write-Error "self-check exited with $($p.ExitCode)"; exit 1 }
      - name: Upgrade and complete uninstall checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-upgrade.ps1 -Bundle apps/desktop/src-tauri/target/release/bundle -Repo "${{ github.repository }}"
      - name: Upload installers (manual run)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: hivetex-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/*/*.exe
            apps/desktop/src-tauri/target/release/bundle/*/*.msi
            apps/desktop/src-tauri/target/release/bundle/*/*.sig
          if-no-files-found: error
